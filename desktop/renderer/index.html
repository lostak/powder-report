<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Overpass:wght@400;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1220;--panel:#121b2e;--panel2:#18233a;--line:#25324d;--ink:#e8eef9;--mute:#93a3bf;--acc:#7cc4ff;--btn:#3d8bff;--good:#5ee0a0;--warn:#ffc65c;--bad:#ff7b7b}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
  .wrap{max-width:600px;margin:0 auto;padding:14px 12px 96px}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 2px 12px}
  h1{font:700 30px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.5px;margin:0}
  h1 span{color:var(--acc)}
  .sub{color:var(--mute);font-size:12.5px}
  h2{font:700 18px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.6px;margin:20px 4px 6px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
  h2 button{font:600 12.5px Inter;text-transform:none;letter-spacing:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0}
  .t{font-weight:600;font-size:15.5px}
  .when{color:var(--mute);font-size:12px;margin-top:1px}
  .desc{font-size:13.5px;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;color:#cdd7ea}
  .desc b{color:var(--ink);font-weight:600}
  .desc.clip{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
  .more{background:none;color:var(--acc);padding:4px 0;font-size:12.5px}
  .todo{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
  .todo:first-of-type{border-top:0}
  .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--acc);background:none;padding:0;margin-top:1px}
  .box.on{background:var(--good);border-color:var(--good)}
  .todo.done span{color:var(--mute);text-decoration:line-through}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  button{font:600 13.5px Inter,sans-serif;border:0;border-radius:10px;padding:9px 13px;background:var(--btn);color:#fff;cursor:pointer}
  button.g{background:var(--panel2);color:var(--ink)}
  button.l{background:none;color:var(--acc);padding:6px 4px}
  button:disabled{opacity:.5}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--mute);margin-right:4px}
  .pill.warn{color:var(--warn)} .pill.good{color:var(--good)} .pill.bad{color:var(--bad)}
  .stat{display:flex;gap:6px;margin-top:8px}
  .stat div{flex:1;background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
  .stat b{display:block;font:700 22px/1 "Barlow Condensed";color:var(--acc)}
  .stat small{color:var(--mute);font-size:11px;text-transform:uppercase}
  .empty{color:var(--mute);font-size:13.5px;padding:4px 2px}
  .err{color:var(--bad);font-size:13px}
  nav{position:fixed;left:0;right:0;bottom:0;background:#0b1220f2;border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:5}
  nav .in{max-width:600px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border-radius:0;padding:13px 0 15px;color:var(--mute);font-size:12.5px}
  nav button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
  .ask{border-color:#3a4f7a;background:linear-gradient(180deg,#16223a,#121b2e)}
  .ask form{display:flex;gap:8px}
  input,textarea,select{flex:1;min-width:0;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:15px Inter,sans-serif}
  textarea{min-height:70px;resize:vertical}
  .sugs{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
  .sugs button{background:var(--panel2);color:var(--acc);font-size:12.5px;padding:6px 10px;border-radius:99px;white-space:nowrap}
  #answer{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
  .sheetbg{position:fixed;inset:0;background:#000a;z-index:15;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;width:100%;max-width:600px;padding:16px 16px 22px;max-height:88vh;overflow:auto}
  .sheet label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px}
  .sheet .note{font-size:12.5px;color:var(--mute);margin-top:10px}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#22324f;color:var(--ink);padding:10px 14px;border-radius:12px;font-size:13.5px;z-index:20;max-width:90vw}
  .hide{display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  a{color:var(--acc)}
  .tap{cursor:pointer;border-color:#2f4670}
  .tap:active{transform:scale(.99)}
  .tap .go{float:right;color:var(--acc);font-size:13px;font-weight:600}
  .full{position:fixed;inset:0;background:var(--bg);z-index:12;overflow:auto}
  .full .in{max-width:600px;margin:0 auto;padding:14px 14px 40px}
  .full .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .big{font:700 34px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.4px;margin:6px 0}
  .kicker{color:var(--acc);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .move{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .move:first-child{border-top:0}
  .move .n{flex:none;width:26px;height:26px;border-radius:99px;background:var(--panel2);color:var(--acc);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
  .move .x{font-weight:600}
  .move .h{color:var(--mute);font-size:13px}
  .timer{font:700 96px/1 "Barlow Condensed",sans-serif;text-align:center;margin:10px 0 0;font-variant-numeric:tabular-nums}
  .phase{text-align:center;font:700 26px/1.1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.5px}
  .phase.rest{color:var(--good)} .phase.work{color:var(--acc)}
  .bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:16px 0}
  .bar i{display:block;height:100%;background:var(--btn)}
  .ctr{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
  .ctr:first-child{border-top:0}
  .ctr .v{font:700 30px/1 "Barlow Condensed";min-width:48px;text-align:center}
  .ctr button{width:46px;height:46px;border-radius:12px;font-size:22px;padding:0}
  .ctr.hl .lbl{color:var(--acc)}
  .rich{white-space:normal}
  .rich p{margin:0 0 7px}
  .rich .lab{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--acc);margin:12px 0 3px}
  .rich .lab:first-child{margin-top:2px}
  .rich ul{margin:2px 0 8px;padding-left:18px}
  .rich li{margin:3px 0}
  .rich ul.sent{list-style:none;padding-left:0}
  .rich ul.sent li{padding-left:10px;border-left:2px solid var(--line)}
  .rich .num{color:var(--ink);font-weight:600}
  .rich .dt{color:var(--warn);font-weight:600;white-space:nowrap}
  .rich .src{margin-top:10px;font-size:12px;color:var(--mute)}
  .rich a.lnk{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--panel2);text-decoration:none;margin:1px 2px}
  .tw{overflow-x:auto;margin:4px 0 8px}
  .rt{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
  .rt th{text-align:left;color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;padding:4px 6px}
  .rt td{padding:6px;border-top:1px solid var(--line);vertical-align:top}
  .rt td,.rt th{overflow-wrap:normal;word-break:normal}
  .rt td:not(:first-child),.rt th{white-space:nowrap}
  .rt td:first-child{min-width:130px}
  .desc.clip{max-height:14em}
  .svgbox{background:#0e1626;border-radius:14px;padding:8px;margin:8px 0}
  .svgbox svg,.pthumb svg{display:block;width:100%;height:auto}
  .pthumb{margin:8px 0 2px;border-radius:10px;overflow:hidden}
  .shotbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
  .aim{display:flex;gap:14px;align-items:center}
  .aimf{flex:none}
  .aimt{font-weight:600;font-size:15px;margin-top:2px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--mute);margin:2px 2px 6px}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .lessonbox{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.55}
  .mono .lessonbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .steps{display:flex;gap:4px;margin:8px 0 4px}
  .steps span{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--mute);padding:6px 0;border-radius:8px;background:var(--panel2)}
  .steps span.on{color:#fff;background:var(--btn)}
  .recall{border-color:#6a5a2a}
  .calc{border-color:#2f4670}
  .calc-f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .calc-f label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mute)}
  .calc-f label:last-child:nth-child(odd){grid-column:1/-1}
  .calc-f input{padding:9px 10px;font-variant-numeric:tabular-nums}
  .calc-o{margin-top:10px;font-size:13.5px}
  .calc-k{font-weight:600;margin-bottom:6px}
  .calc-n{color:var(--mute);font-size:12px;margin-top:6px}
  .calc-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
  .calc-t th{color:var(--mute);font-weight:600;font-size:11.5px;text-align:left;padding:4px}
  .calc-t td{padding:5px 4px;border-top:1px solid var(--line)}
  .pos{color:var(--good);font-weight:600} .neg{color:var(--bad);font-weight:600}
  details.card summary{cursor:pointer;font-weight:600}
  details .calc{background:var(--panel2)}
</style><link rel="stylesheet" href="wide.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="skin.css"><script src="theme.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>My <span>Life</span></h1><div class="sub" id="dateLine"></div></div>
    <div><button class="g" id="refresh">↻</button> <button id="cmdBtn">+ Command</button></div>
  </header>

  <div id="setup" class="card hide"></div>

  <div class="card ask" id="askCard">
    <form id="askForm"><input id="askIn" placeholder="Ask Claude about anything in your life…" autocomplete="off"><button id="askGo">Ask</button></form>
    <div class="sugs" id="sugs"></div>
    <p id="answer" class="hide"></p>
  </div>

  <section id="tab-today"></section>
  <section id="tab-ski" class="hide"></section>
  <section id="tab-bets" class="hide"></section>
  <section id="tab-pool" class="hide"></section>
  <section id="tab-life" class="hide"></section>
</div>

<nav><div class="in">
  <button data-tab="today" class="on">Today</button>
  <button data-tab="ski">Ski</button>
  <button data-tab="bets">Bets & Games</button>
  <button data-tab="pool">Pool</button>
  <button data-tab="life">Life admin</button>
</div></nav>

<script>
// ============ config ============
const CAL = "Google Calendar";
const SKI = "Ski Outlook";
const TZ = "America/Denver";
const CACHE = { cache: { staleTime: 5 * 60e3, gcTime: 24 * 3600e3 } };

// ============ helpers ============
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const parts = (d) => Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(d).map(p => [p.type, p.value]));
const localISO = (d) => { const p = parts(d); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}`; };
const localDate = (d) => localISO(d).slice(0, 10);
const addDays = (n) => new Date(Date.now() + n * 864e5);
const today = () => localDate(new Date());
const evStart = (e) => new Date(e.start?.dateTime || (e.start?.date + "T12:00:00"));
const evDate = (e) => e.start?.date || localDate(evStart(e));
const fmtWhen = (e) => {
  const d = evStart(e);
  const day = d.toLocaleDateString([], { timeZone: TZ, weekday: "short", month: "short", day: "numeric" });
  return e.start?.date ? day : `${day}, ${d.toLocaleTimeString([], { timeZone: TZ, hour: "numeric", minute: "2-digit" })}`;
};
const isDone = (e) => /^✅/.test(e.summary || "");
const title = (e) => (e.summary || "").replace(/^✅\s*/, "");
const cap1 = (s) => String(s || "").replace(/^(\W*)(\p{Ll})/u, (m, pre, c) => pre + c.toUpperCase());
const nice = (e) => cap1(title(e).replace(/^Personal:\s*/, ""));
let toastT;
function toast(msg) {
  let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.append(t); }
  t.textContent = msg; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", 4200);
}
// machine lines (markers, IDs) are hidden from display
const HIDE_LINE = /^(\s*[A-Z0-9]+(-[A-Z0-9]+)+(:.*)?\s*$|\s*(Done via )?(Pocket ID|Calendar note ID):.*$)/;
// ---- readable rendering for every task's event text ----
const shortUrl = (u) => u.replace(/^https?:\/\/(www\.)?/, "").split(/[/?#]/)[0];
function inline(s) {
  // escape, then: links → short chips, money/odds/percent → emphasis, dates → compact
  let h = esc(s);
  h = h.replace(/https?:\/\/[^\s<>"')]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener" class="lnk">${esc(shortUrl(u.replace(/&amp;/g, "&")))}</a>`);
  h = h.replace(/(^|[\s(])((?:\$\d[\d,]*(?:\.\d+)?)|(?:[+\-−]\d{3,4}\b)|(?:\d+(?:\.\d+)?%))/g, '$1<b class="num">$2</b>');
  h = h.replace(/\b(20\d\d)-(\d\d)-(\d\d)\b/g, (m, y, mo, d) => { const dt = new Date(+y, +mo - 1, +d); return `<span class="dt">${dt.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" })}</span>`; });
  return h;
}
function cellsTable(rows) {
  // rows: arrays of cells. If column i shares a leading label ("today $31" / "today $114"), lift it into the header.
  const w = Math.max(...rows.map(r => r.length));
  const head = [];
  for (let i = 0; i < w; i++) {
    const col = rows.map(r => r[i] || "");
    const m = col.map(c => c.match(/^([A-Za-z][A-Za-z ]{1,24}?)\s+(?=[$\d+\-−(]|none|n\/a|–)/));
    if (i > 0 && m.every(Boolean) && m.every(x => x[1] === m[0][1])) { head[i] = m[0][1]; rows.forEach(r => r[i] = (r[i] || "").slice(m[0][1].length).trim()); }
    else head[i] = "";
  }
  const hasHead = head.some(Boolean);
  return `<div class="tw"><table class="rt">${hasHead ? `<tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>` : ""}${rows.map(r => `<tr>${Array.from({ length: w }, (_, i) => `<td>${inline(r[i] || "")}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function fmtDesc(text) {
  const lines = String(text || "").replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li)>/gi, "\n").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&nbsp;/g, " ")
    .split("\n").filter(l => !HIDE_LINE.test(l));
  const out = []; let list = null, table = null;
  const flush = () => { if (list) { out.push(`<ul>${list.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); list = null; } if (table) { out.push(cellsTable(table)); table = null; } };
  for (let raw of lines) {
    const l = raw.trim();
    if (!l) { flush(); continue; }
    // pipe-separated rows → table
    if ((l.match(/ \| /g) || []).length >= 1) { if (list) flush(); (table = table || []).push(l.split(/\s+\|\s+/)); continue; }
    if (table) flush();
    // explicit bullets / numbered / checkbox lines
    const b = l.match(/^(?:[-•*▪]|\d{1,2}[.)])\s+(.*)$/);
    if (b) { (list = list || []).push(b[1]); continue; }
    // "LABEL: rest" → section heading
    const m = l.match(/^([A-Z][A-Za-z0-9 &/'’()\-?]{1,40}):\s*(.*)$/);
    if (m && (/^[A-Z0-9 &/'’()\-?]+$/.test(m[1]) || m[1].split(" ").length <= 4)) {
      flush();
      const rest = m[2];
      if (/^sources?$/i.test(m[1])) { out.push(`<div class="src">${inline(rest)}</div>`); continue; }
      out.push(`<div class="lab">${esc(m[1])}</div>`);
      if (rest) pushPara(rest);
      continue;
    }
    flush(); pushPara(l);
  }
  flush();
  return `<div class="rich">${out.join("")}</div>`;
  function pushPara(s) {
    // long " · " / "; " runs → bullets; very long prose → one sentence per line
    if (s.length > 110 && (s.match(/ · /g) || []).length >= 2) { out.push(`<ul>${s.split(/\s+·\s+/).map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); return; }
    if (s.length > 160 && (s.match(/; /g) || []).length >= 2) { out.push(`<ul>${s.split(/;\s+/).map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); return; }
    if (s.length > 240) { const parts = s.split(/(?<=[.!?])\s+(?=[A-Z(])/); out.push(`<ul class="sent">${parts.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); return; }
    out.push(`<p>${inline(s)}</p>`);
  }
}
const richSize = (h) => (h.match(/<(p|li|tr|div class="lab")/g) || []).length;
const line = (desc, label) => { const m = String(desc || "").match(new RegExp("^\\s*" + label + "\\s*(.*)$", "m")); return m ? m[1].trim() : null; };

// ============ data ============
let mcp = null, sample = null, skiOk = null;
let EV = [];          // Personal events, -14d..+31d
let LOGS = {};        // title -> event
let WATCH = { price: [], show: [] };
let NOTES = [];       // "Claude …" calendar notes, pending
let LOADERR = null;

async function payload(p) { p = await p; let v = p?.payload ?? p; if (typeof v === "string") { try { v = JSON.parse(v); } catch {} } return v; }
async function listAll(q, start, end, maxPages = 3, refresh = false) {
  const out = []; let tok;
  for (let i = 0; i < maxPages; i++) {
    const input = { fullText: q, startTime: start, endTime: end, pageSize: 250, orderBy: "startTime" };
    if (tok) input.pageToken = tok;
    const v = await payload(mcp.callTool(CAL, "list_events", input, refresh ? { cache: { ...CACHE.cache, refresh: true } } : CACHE));
    out.push(...(v?.events || [])); tok = v?.nextPageToken; if (!tok) break;
  }
  return out;
}
const LOG_TITLES = ["Personal: pool log", "Personal: ski workout log", "Personal: betting lesson log", "Personal: picks log",
  "Price watch: Broncos & Avs tickets (log)", "Personal: billers log", "Personal: car log", "Personal: ski season log", "Personal: WhoStarts log"];
async function loadAll(refresh = false) {
  const yr = localISO(addDays(-365)), tmr = localISO(addDays(1));
  const logQ = (q) => listAll(q, yr, tmr, 1, refresh).catch(() => []);
  const [main, l1, l2, l3, l4, l5, l6, l7, l8, pw, sw, notes, arch] = await Promise.all([
    listAll("Personal", localISO(addDays(-14)), localISO(addDays(31)), 3, refresh),
    logQ("POOL-LOG"), logQ("SKI-LOG"), logQ("BET-LOG"), logQ("PICKS-LOG"), logQ("TICKET-WATCH-LOG"), logQ("BILLERS-LOG"),
    logQ("car log"), logQ("WhoStarts log"),
    logQ("PRICE-WATCH"), logQ("SHOW-WATCH"),
    listAll("Claude", localISO(addDays(-2)), localISO(addDays(7)), 1, refresh).catch(() => []),
    logQ("PICKS-ARCHIVE"),   // older picks/slips moved out of the picks log (Google cuts descriptions off at ~8,192 chars)
  ]);
  ARCHIVES = arch.filter(e => /^Personal: picks archive/.test(e.summary || ""));
  EV = main.filter(e => /^(✅\s*)?Personal/.test(e.summary || ""));
  LOGS = {};
  for (const e of [...l1, ...l2, ...l3, ...l4, ...l5, ...l6, ...l7, ...l8, ...main]) {
    const t = title(e); if (LOG_TITLES.includes(t) && (!LOGS[t] || evStart(e) > evStart(LOGS[t]))) LOGS[t] = e;
  }
  WATCH.price = pw.filter(e => /^(✅\s*)?Price watch:/.test(e.summary || "") && /PRICE-WATCH/.test(e.description || "") && !/\(log\)$/.test(e.summary));
  WATCH.show = sw.filter(e => /^(✅\s*)?Show watch:/.test(e.summary || ""));
  NOTES = notes.filter(e => /^Claude\b/i.test(e.summary || "") && !/Handled by Claude/.test(e.description || ""));
}

const K = {
  brief: /^Personal: morning brief/, slate: /^Personal: betting slate/, lesson: /^Personal: betting lesson \d/,
  workout: /^Personal: ski workout –/, pool: /^Personal: pool focus/, outlook: /^Personal: ski weekend outlook/,
  powder: /^Personal: powder (alert|day)/, reset: /^Personal: Sunday reset/, bills: /^Personal: bills & renewals/,
  pay: /^Personal: pay /, ret: /^Personal: return window/, deliv: /^Personal: deliveries today/,
  travel: /^Personal: (✈|🏨|check in for|leave for DEN|last day to cancel)/,
  tickets: /^Personal: (ticket drop|game-day ticket drop|Broncos & Avs ticket prices)/,
  prices: /^Personal: (price drop|fare drop|keep watching)/, shows: /^Personal: (show announced|on-sale now|Red Rocks)/,
  inbox: /^Personal: inbox cleanup/, todo: /^Personal to-do/, log: / log$|\(log\)$|^Personal: (life settings|golf watch)$/,
};
const kindOf = (e) => { const t = title(e); for (const [k, re] of Object.entries(K)) if (re.test(t)) return k; const d = e.description || "";
  if (/UPKEEP:/.test(d)) return "upkeep"; if (/YEARLY-DATE:/.test(d)) return "yearly"; if (/EXPIRES:/.test(d)) return "expires";
  if (/RENEWAL:/.test(d)) return "renewal"; if (/APPT:/.test(d)) return "appt"; if (/^Personal: (ski|ticket|price|show|tee time open|golf courses open)/.test(t)) return "alert"; return "reminder"; };
const BRIEFS = ["brief", "slate", "lesson", "workout", "pool", "outlook", "reset", "bills", "deliv", "inbox", "log", "todo"];
const of = (k) => EV.filter(e => kindOf(e) === k);
const latest = (k, pred = () => true) => of(k).filter(pred).sort((a, b) => evStart(b) - evStart(a))[0];
const onDay = (e, d) => evDate(e) === d;

async function confirmSheet({ heading, body = "", fields = [], ok = "Confirm", note = "" }) {
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "sheetbg";
    bg.innerHTML = `<div class="sheet"><div class="t" style="font-size:17px">${esc(heading)}</div>
      ${body ? `<div class="desc">${esc(body)}</div>` : ""}
      ${fields.map((f, i) => `<label>${esc(f.label)}</label>${f.type === "textarea" ? `<textarea data-i="${i}" placeholder="${esc(f.ph || "")}">${esc(f.value || "")}</textarea>`
        : f.type === "select" ? `<select data-i="${i}">${f.options.map(o => `<option>${esc(o)}</option>`).join("")}</select>`
        : `<input data-i="${i}" type="${f.type || "text"}" placeholder="${esc(f.ph || "")}" value="${esc(f.value || "")}">`}`).join("")}
      ${note ? `<div class="note">${esc(note)}</div>` : ""}
      <div class="acts" style="margin-top:14px"><button class="ok">${esc(ok)}</button><button class="g no">Cancel</button></div></div>`;
    document.body.append(bg);
    const done = (v) => { bg.remove(); res(v); };
    bg.querySelector(".no").onclick = () => done(null);
    bg.onclick = (e) => { if (e.target === bg) done(null); };
    bg.querySelector(".ok").onclick = () => {
      const vals = fields.map((f, i) => bg.querySelector(`[data-i="${i}"]`).value.trim());
      if (fields.some((f, i) => f.required && !vals[i])) { toast("Fill in the required field."); return; }
      done(vals);
    };
    bg.querySelector("[data-i]")?.focus();
  });
}
// Queue a command for the Pocket meeting processor (it reads calendar notes titled "Claude …").
async function queue(cmd, detail = "") {
  if (!mcp) return toast("Open this in Claude with Google Calendar connected.");
  const now = new Date(), end = new Date(now.getTime() + 15 * 60e3);
  try {
    await mcp.callTool(CAL, "create_event", { summary: `Claude: personal ${cmd}`, description: (detail ? detail + "\n\n" : "") + "Sent from the Life app.",
      startTime: localISO(now), endTime: localISO(end), useDefaultReminders: false, notificationLevel: "NONE" });
    const h = +parts(now).hour;
    toast(h >= 8 && h < 19 ? "Queued. Your Pocket processor handles it at the top of the hour." : "Queued. Your Pocket processor handles it at 8 AM.");
    await mcp.invalidate(CAL).catch(() => {}); reload(true);
  } catch (e) { toast(writeErr(e)); }
}
async function updateEvent(id, patch) { await mcp.callTool(CAL, "update_event", { eventId: id, notificationLevel: "NONE", ...patch }); await mcp.invalidate(CAL).catch(() => {}); }
const writeErr = (e) => e?.code === "approval_required" || e?.code === "not_in_manifest" ? "That needs your OK to let this page change your calendar." : e?.code === "needs_reauth" ? "Reconnect Google Calendar in Settings → Connectors." : "Couldn't update your calendar" + (e?.message ? `: ${e.message}` : ".");
async function markDone(e, how = "done") {
  const ok = await confirmSheet({ heading: how === "dropped" ? "Drop this item?" : "Mark done?", body: nice(e), ok: how === "dropped" ? "Drop" : "Mark done" });
  if (!ok) return;
  try {
    await updateEvent(e.id, { summary: "✅ " + title(e), description: `DONE ${today()} – ${how} (Life app)\n` + (e.description || ""), useDefaultReminders: false });
    toast("Marked " + how + "."); reload(true);
  } catch (err) { toast(writeErr(err)); }
}
async function toggleTodo(e, idx) {
  const lines = String(e.description || "").split("\n"); const l = lines[idx]; if (!l || !l.includes("☐")) return;
  const ok = await confirmSheet({ heading: "Check this off?", body: l.replace("☐", "").trim(), ok: "Check off" }); if (!ok) return;
  lines[idx] = l.replace("☐", "☑") + ` – done ${today()}`;
  try { await updateEvent(e.id, { description: lines.join("\n") }); toast("Checked off."); reload(true); } catch (err) { toast(writeErr(err)); }
}

function card(e, { acts = [], clip = true, todo = false, pills = "" } = {}) {

    const lines = String(e.description || "").split("\n");

  } else {
    const d = fmtDesc(e.description);
    const big = clip && richSize(d) > 8;
    body = d && d !== '<div class="rich"></div>' ? `<div class="desc ${big ? "clip" : ""}" id="${id}">${d}</div>${big ? `<button class="more" data-more="${id}">Show all</button>` : ""}` : "";

}

function rot(logTitle, counterRe, cycle, names) {
  const lg = LOGS[logTitle]; const d = lg?.description || "";
  const n = +(line(d, counterRe) || 1); const sessions = (d.match(/^\d{4}-\d{2}-\d{2}:/gm) || []).length;

  return { n, sessions, last, next: names[(n - 1) % cycle], log: lg };
}

  ["review", /^REVIEW:/], ["done", /^DONE\?/], ["answer", /^RECALL ANSWER:/], ["sources", /^Sources:/]];
function parseLesson(desc) {
  const lines = String(desc || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").split("\n");
  const out = {}; let cur = "pre";
  for (const raw of lines) {
    const l = raw.trim(); const hit = LESSON_LABELS.find(([, re]) => re.test(l));
    if (/^BET-CALC:/.test(l)) { out.calc = l.replace(/^BET-CALC:\s*/, "").split(/\s+/); continue; }
    if (hit) { cur = hit[0]; l.replace(hit[1], "").trim() && (out[cur] = (out[cur] ? out[cur] + "\n" : "") + l.replace(hit[1], "").trim()); if (!out[cur]) out[cur] = ""; continue; }
    if (HIDE_LINE.test(raw)) continue;
    out[cur] = (out[cur] ? out[cur] + "\n" : "") + raw;
  }
  for (const k in out) if (typeof out[k] === "string") out[k] = out[k].replace(/\n{3,}/g, "\n\n").trim();
  if (out.recall) out.recall = out.recall.replace(/\s*\(answer at the bottom\)\s*$/i, "");

}

    ${P?.exercise ? `<div class="card ex"><div class="when">2-minute exercise</div><div class="lessonbox">${fmtDesc(P.exercise)}</div>
      <textarea id="xIn" placeholder="Your numbers and answer" style="margin-top:10px">${esc(st.ex || "")}</textarea>
      ${sample ? `<div class="acts"><button class="g" id="xCheck">Check with Claude</button></div><div class="lessonbox" id="xFb"></div>` : ""}</div>` : ""}
    <div class="card"><div class="when">Quiz me</div><div class="lessonbox" id="qQ">${sample ? "Get a fresh numeric question on this lesson." : "Quizzes need Claude, which isn't available in this view."}</div>
      ${sample ? `<input id="qIn" class="hide" placeholder="Your answer" style="margin-top:10px"><div class="acts"><button class="g" id="qNew">New question</button><button class="g hide" id="qGo">Grade it</button></div><div class="lessonbox" id="qFb"></div>` : ""}</div>
    <details class="card"><summary class="when">All calculators</summary>${Object.keys(CALCS).filter(k => k !== ck).map(k => calcCard(k)).join("")}</details>
    <div class="acts"><button id="bDone" style="flex:1;padding:14px">Done: log it with my answers</button><button class="g" data-cmd="betrepeat">Repeat this one</button></div>
    ${srcs.length ? `<div class="when" style="margin:12px 4px">Sources: ${srcs.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/, "").split("/")[0])}</a>`).join(" · ")}</div>` : ""}`);
  wireCalcs(f);
  const steps = f.querySelectorAll(".steps span"); const mark = (i) => steps.forEach((s, j) => s.classList.toggle("on", j <= i));
  f.addEventListener("scroll", () => { const h = f.scrollHeight - f.clientHeight || 1; mark(Math.min(4, Math.floor(5 * f.scrollTop / h))); });
  const save = () => { st.recall = f.querySelector("#rIn")?.value || st.recall || ""; st.ex = f.querySelector("#xIn")?.value || st.ex || ""; saveBet(n, st); };
  f.querySelector("#rIn")?.addEventListener("input", save); f.querySelector("#xIn")?.addEventListener("input", save);
  f.querySelector("#rShow")?.addEventListener("click", (e) => { f.querySelector("#rAns").classList.remove("hide"); e.target.remove(); });
  const grade = async (box, q, a, ctx) => {
    if (!a.trim()) { box.textContent = "Type an answer first."; return; }
    box.textContent = "Checking…";
    try { await sample([{ role: "user", content: `You're grading a betting-math answer for Bradley, an experienced bettor. ${ctx}\n\nQuestion: ${q}\nHis answer: ${a}\n\nSay correct, close, or off, then show the right math in 2–4 short plain-text lines. No markdown.` }], { modelTier: "default", cache: false, onText: ({ text }) => { box.textContent = text; } }); }
    catch { box.textContent = "Claude couldn't check it just now."; }
  };
  f.querySelector("#rCheck")?.addEventListener("click", () => grade(f.querySelector("#rFb"), P.recall, f.querySelector("#rIn").value, `The reference answer is: ${P.answer || "(none given)"}.`));
  f.querySelector("#xCheck")?.addEventListener("click", () => grade(f.querySelector("#xFb"), P.exercise, f.querySelector("#xIn").value, `Lesson ${n}: ${name}. Lesson example for context: ${String(P.example || "").slice(0, 900)} If his numbers come from a live slate you can't verify, check the math and method rather than the prices.`));
  let quizQ = "";
  f.querySelector("#qNew")?.addEventListener("click", async (e) => {
    const box = f.querySelector("#qQ"); e.target.disabled = true; box.textContent = "Writing a question…"; f.querySelector("#qFb").textContent = "";
    try { const r = await sample([{ role: "user", content: `Write ONE numeric practice question on betting lesson ${n} of 20, "${name}", for an experienced bettor (FanDuel/DraftKings/bet365; NHL, NFL, table tennis). Use realistic American odds. Question only, 1–3 sentences, plain text, no answer. Make it different from: ${quizQ || "nothing yet"}` }], { modelTier: "default", cache: false, onText: ({ text }) => { box.textContent = text; } });
      quizQ = r?.text || box.textContent; f.querySelector("#qIn").classList.remove("hide"); f.querySelector("#qIn").value = ""; f.querySelector("#qGo").classList.remove("hide"); }
    catch { box.textContent = "Claude couldn't write a question just now."; }
    finally { e.target.disabled = false; e.target.textContent = "Another question"; }
  });
  f.querySelector("#qGo")?.addEventListener("click", () => grade(f.querySelector("#qFb"), quizQ, f.querySelector("#qIn").value, `Lesson ${n}: ${name}.`));
  f.querySelector("#bDone").onclick = () => { save(); const bits = [st.recall ? "recall: " + st.recall : "", st.ex ? "exercise: " + st.ex : ""].filter(Boolean).join("; "); CMDS.betdone(bits); };
  f.querySelector("#lTeach")?.addEventListener("click", async (e) => {
    const box = f.querySelector("#lBody");
    const prompt = `Teach lesson ${n} of 20, "${name}", to Bradley, an experienced bettor who works professionally with betting markets and bets in Colorado on FanDuel, DraftKings and bet365 (table tennis, NFL/college football, NHL). Precise and quantitative, no basics padding. If his picks log has relevant numbers, use them (search_calendar "picks log"); otherwise use a realistic example and say it's illustrative. About 300 words, plain text with these labels on their own lines: THE IDEA:, THE MATH:, REAL EXAMPLE:, 2-MINUTE EXERCISE:. No markdown.`;
    if (!sample && window.lifeDesktop) { window.lifeDesktop.openClaude(prompt.replace("(search_calendar \"picks log\")", "(my Google Calendar event \"Personal: picks log\")")); box.textContent = "Opened Claude to teach it."; return; }
    if (!sample) { box.textContent = "Asking Claude isn't available in this view."; return; }
    e.target.disabled = true; box.textContent = "Writing tonight's lesson…";
    try { const r = await sample([{ role: "user", content: prompt }], { tools: TOOLS().filter(t => t.name === "search_calendar"), modelTier: "default", cache: false, onText: ({ text }) => { box.innerHTML = fmtDesc(text); } }); lessonCache[n] = r?.text || box.textContent; openBet(); }
    catch { box.textContent = "Claude couldn't write it just now. Try again in a minute."; e.target.disabled = false; }
  });
}

// ============ commands (same wording as your Pocket voice commands) ============
const CMDS = {

  skidone: async () => { const v = await confirmSheet({ heading: "Log tonight's ski workout", fields: [{ label: "Notes (optional)", type: "textarea", ph: "legs burned on the wall sit" }], ok: "Log it" }); if (v) queue("did ski workout" + (v[0] ? ": " + v[0] : "")); },

  betrepeat: async () => { const v = await confirmSheet({ heading: "Stay on this lesson next time?", ok: "Repeat" }); if (v) queue("betting lesson, repeat"); },

    if (!v) return; const [w, p, m, l, b, n] = v;
    const bits = [w && p ? `won ${w} of ${p} games` : "", m ? `${m} makeable misses` : "", l ? `${l} leaves within a foot` : "", b ? `${b} breaks with a ball made` : "", n].filter(Boolean);
    queue("practiced pool" + (bits.length ? ": " + bits.join(", ") : ""));

  poolnights: async () => { const v = await confirmSheet({ heading: "Which nights do you play?", fields: [{ label: "Days, or \"any\"", ph: "Tue Thu", required: true }], ok: "Save" }); if (v) queue("pool nights " + v[0]); },
  show: async () => { const v = await confirmSheet({ heading: "Watch for a Denver show", fields: [{ label: "Artist, comedian, team or event", required: true }, { label: "Notes (venue, dates, seats)", ph: "Red Rocks only" }], ok: "Start watching" }); if (v) queue(`show watch: ${v[0]}${v[1] ? " – " + v[1] : ""}`); },

  flight: async () => { const v = await confirmSheet({ heading: "Watch a flight from Denver", fields: [{ label: "Destination", required: true, ph: "Cabo" }, { label: "Dates or month", required: true, ph: "March, 5 nights" }, { label: "Target per person (optional)", type: "number" }, { label: "Travelers / preferences", ph: "2 people, nonstop" }], ok: "Start watching" }); if (v) queue(`flight watch: ${v[0]} ${v[1]}${v[2] ? " under $" + v[2] : ""}${v[3] ? ", " + v[3] : ""}`); },
  yearly: async () => { const v = await confirmSheet({ heading: "Add a birthday or yearly date", fields: [{ label: "Whose and what", required: true, ph: "Mom's birthday" }, { label: "Date (no year needed)", required: true, ph: "March 14" }], ok: "Add" }); if (v) queue(`${v[0]} ${v[1]}`); },
  expires: async () => { const v = await confirmSheet({ heading: "Track an expiration", fields: [{ label: "What expires", required: true, ph: "passport" }, { label: "Date", required: true, type: "date" }], ok: "Add", note: "Don't enter ID or license numbers." }); if (v) queue(`${v[0]} expires ${v[1]}`); },
  oil: async () => { const v = await confirmSheet({ heading: "Log an oil change", fields: [{ label: "Odometer miles", type: "number", required: true }], ok: "Log it" }); if (v) queue(`oil change at ${v[0]}`); },
  home: async () => { const v = await confirmSheet({ heading: "Home details for upkeep reminders", fields: [{ label: "Home", type: "select", options: ["house", "condo", "apartment"] }, { label: "Sprinklers", type: "select", options: ["yes", "no"] }, { label: "Snow tires", type: "select", options: ["yes", "no"] }], ok: "Save" }); if (v) queue(`home: ${v[0]}, sprinklers ${v[1]}, snow tires ${v[2]}`); },
  whostarts: async () => { const v = await confirmSheet({ heading: "Is WhoStarts live on Google Play?", body: "This turns on your weekly WhoStarts Play check.", ok: "Yes, it's live" }); if (v) queue("WhoStarts is live"); },
};
const ACTS = {
  done: (e) => markDone(e, "done"),
  drop: (e) => markDone(e, "dropped"),
  dropstale: async (e) => { const v = await confirmSheet({ heading: "Drop stale items", body: "Drops the stale items numbered in your Sunday reset.", fields: [{ label: "Which numbers (blank = all)", ph: "1 and 3" }], ok: "Drop" }); if (v) queue("drop stale" + (v[0] ? " " + v[0] : "")); },

// ============ Ask Claude (your Claude plan; read-only calendar tools) ============
const SUGS = {
  today: ["What needs my attention today?", "What's overdue?", "Plan my evening"],
  ski: ["Where should I ski this weekend?", "Any powder coming?", "How's my workout streak?"],
  bets: ["Summarize today's picks", "How am I doing vs the close?", "Best value Avs game for 4?"],
  pool: ["What should I work on next?", "How's my pool trend?", "Explain today's drill"],
  life: ["What bills are coming up?", "Any returns closing soon?", "What upkeep is due?"],
};
function renderSugs() { $("#sugs").innerHTML = SUGS[tab].map(q => `<button data-q="${esc(q)}">${esc(q)}</button>`).join(""); }
const compact = (e) => ({ title: e.summary, when: fmtWhen(e), description: String(e.description || "").slice(0, 2500) });
const TOOLS = () => [
  { name: "search_calendar", description: "Search Bradley's Google Calendar (primary). Returns matching events with titles, times and descriptions. Use words from titles like 'Personal: pool log', 'betting slate', 'PRICE-WATCH', 'bills'.",
    inputSchema: { type: "object", properties: { query: { type: "string" }, days_back: { type: "integer", default: 14 }, days_ahead: { type: "integer", default: 30 } }, required: ["query"] },
    execute: async (i) => { const ev = await listAll(i.query, localISO(addDays(-(i.days_back ?? 14))), localISO(addDays(i.days_ahead ?? 30)), 1); return ev.slice(-40).map(compact); } },
  { name: "todays_events", description: "Every event on Bradley's calendar today (work and personal), in time order.",
    inputSchema: { type: "object", properties: {} },
    execute: async () => { const v = await payload(mcp.callTool(CAL, "list_events", { startTime: today() + "T00:00:00", endTime: today() + "T23:59:59", orderBy: "startTime", pageSize: 100 }, CACHE)); return (v?.events || []).map(compact); } },
  { name: "life_app_snapshot", description: "What the Life app currently shows: logs (pool, ski workout, betting lesson, picks, tickets, billers, car), price/show watches, and queued commands.",
    inputSchema: { type: "object", properties: {} },
    execute: async () => ({ logs: Object.fromEntries(Object.entries(LOGS).map(([k, e]) => [k, String(e.description || "").slice(0, 3000)])), priceWatches: WATCH.price.map(compact), showWatches: WATCH.show.map(compact), queued: NOTES.map(n => n.summary) }) },
  ...(skiOk ? [{ name: "ski_weekend_outlook", description: "Live weekend snow outlook for his Ikon resorts.", inputSchema: { type: "object", properties: {} },
    execute: async () => payload(mcp.callTool(SKI, "get_weekend_outlook", null)) }] : []),
];
let askCtl = null;
async function ask(q) {
  q = (q || "").trim(); if (!q) return;
  const out = $("#answer"); out.classList.remove("hide"); $("#askIn").value = q; window.scrollTo({ top: 0, behavior: "smooth" });
  if (!sample && window.lifeDesktop) { out.textContent = "Opened Claude with your question (uses your Claude plan)."; window.lifeDesktop.openClaude(`Use my Google Calendar (my "Personal:" events and logs from my Life project tasks). ${q} Keep it short.`); return; }
  if (!sample) { out.textContent = "Asking Claude isn't available in this view."; return; }
  if (!mcp) { out.textContent = "Connect Google Calendar first."; return; }
  askCtl?.abort(); askCtl = new AbortController(); out.textContent = "Thinking…"; $("#askGo").disabled = true;
  const sys = `You're Bradley's personal assistant inside his Life app. He lives in Aurora/Denver, CO. Today is ${new Date().toLocaleDateString([], { timeZone: TZ, weekday: "long", month: "long", day: "numeric", year: "numeric" })}, ${new Date().toLocaleTimeString([], { timeZone: TZ, hour: "numeric", minute: "2-digit" })} Mountain. His scheduled Claude tasks write everything to his Google Calendar as "Personal: …" events: morning brief, betting slate and picks log, betting lesson log, ski workout log, pool log, ski weekend outlook, powder alerts, ticket watch log, price/show watches, bills & renewals, returns, deliveries, upkeep, Sunday reset. Use the tools to look things up rather than guessing. You can't change anything; if he wants a change, tell him which button in the app to tap or which "personal …" command to send. Ignore work/client events unless he asks. Answer in a few short, plain sentences, no markdown or headings.`;
  try {
    await sample([{ role: "user", content: `${sys}\n\nQuestion: ${q}` }], { tools: TOOLS(), signal: askCtl.signal, modelTier: "default", cache: false, onText: ({ text }) => { out.textContent = text; } });
  } catch (e) {
    if (e?.code === "cancelled" || e?.name === "AbortError") return;
    out.textContent = e?.code === "rate_limited" ? "Claude is busy. Try again in a minute." : e?.code === "not_granted" ? "Asking Claude isn't allowed in this view." : "Claude couldn't answer just now.";
  } finally { $("#askGo").disabled = false; }
}
$("#askForm").addEventListener("submit", (e) => { e.preventDefault(); ask($("#askIn").value); });

// ============ boot ============
function setup(msg) { const s = $("#setup"); s.classList.remove("hide"); s.innerHTML = `<div class="t">Almost there</div><div class="desc">${esc(msg)}</div>`; }
function calErr(e) {
  switch (e?.code) {
    case "server_not_connected": case "selection_required": return "Connect Google Calendar in claude.ai Settings → Connectors, then reopen this page.";
    case "needs_reauth": return window.lifeDesktop ? "Sign in to Google again from ⚙ Settings." : "Reconnect Google Calendar in claude.ai Settings → Connectors.";
    case "not_in_manifest": case "approval_required": case "consent_required": return "Allow this page to use Google Calendar when Claude asks (tap ↻ to ask again).";
    case "server_unavailable": return "Google Calendar didn't answer. Tap ↻ to retry.";
    default: return "Couldn't load your calendar" + (e?.message ? `: ${e.message}` : ".");
  }
}
// ---- keeping every view current ----
// Phones and desktops keep this page open for days, so it reloads the calendar by itself: when you come back to it,
// every 5 minutes while it's on screen, and at midnight. Each load bypasses the connector cache. The header always
// says when the data was loaded, and a failed refresh shows a warning instead of silently leaving old data up.
let ARCHIVES = [];
let loading = false, lastLoad = 0, loadFail = null, again = false;
const AFTER_RELOAD = [];                 // other views (bet history, …) re-read their data here after each load
const busyTyping = () => { const a = document.activeElement; return !!a && (a.matches?.("input,textarea,select") || a.isContentEditable); };
function freshLine() {
  const day = new Date().toLocaleDateString([], { timeZone: TZ, weekday: "long", month: "long", day: "numeric" });
  const at = lastLoad ? new Date(lastLoad).toLocaleTimeString([], { timeZone: TZ, hour: "numeric", minute: "2-digit" }) : "";
  const el = $("#dateLine"); if (!el) return;
  el.innerHTML = esc(day) + (loadFail ? ` · <span style="color:var(--warn)">⚠ couldn't refresh${at ? ", showing " + esc(at) : ""} – tap ↻</span>` : at ? ` · updated ${esc(at)}` : "");
  el.title = loadFail ? calErr(loadFail) : "";
}
async function reload(refresh = true) {
  if (!mcp) return; if (loading) { again = true; return; }   // a save during a background refresh still gets a fresh load after it
  loading = true; $("#refresh").disabled = true;
  try {
    await loadAll(refresh); lastLoad = Date.now(); loadFail = null; $("#setup").classList.add("hide"); renderAll();
    for (const f of AFTER_RELOAD) { try { await f(); } catch {} }
  } catch (e) { loadFail = e; if (!lastLoad) setup(calErr(e)); }
  finally { loading = false; $("#refresh").disabled = false; freshLine(); if (again) { again = false; reload(true); } }
}
let loadedDay = new Date().toDateString();
function maybeReload(maxAge) {
  if (document.hidden || loading || busyTyping()) return;
  if (new Date().toDateString() !== loadedDay) { loadedDay = new Date().toDateString(); return reload(true); }   // new day: "today" changed
  if (Date.now() - lastLoad > maxAge) reload(true);
}
document.addEventListener("visibilitychange", () => maybeReload(60e3));
window.addEventListener("focus", () => maybeReload(60e3));
window.addEventListener("pageshow", () => maybeReload(60e3));
window.addEventListener("online", () => maybeReload(0));
setInterval(() => { maybeReload(5 * 60e3); freshLine(); }, 60e3);
$("#refresh").onclick = () => reload(true);
freshLine();
if (TABS[location.hash.slice(1)]) document.querySelector(`nav button[data-tab="${location.hash.slice(1)}"]`).click(); else renderSugs();
Object.keys(TABS).forEach(k => $("#tab-" + k).innerHTML = '<div class="empty" style="padding:20px 4px">Loading your calendar…</div>');
(async () => {
  const c = window.claude;
  if (!c?.use) { setup("Open this page in Claude to load your life data."); return; }
  c.use("sample").then(s => { sample = s; if (!s && !window.lifeDesktop) $("#askCard").classList.add("hide"); });
  window.lifeDesktop?.onOpen?.((w) => { if (w === "today") document.querySelector('nav button[data-tab="today"]').click(); else { closeFull(); OPEN[w]?.(); } });
  if (window.lifeDesktop) { const g = document.createElement("button"); g.className = "g"; g.textContent = "⚙"; g.title = "Settings"; g.onclick = () => window.lifeDesktop.openSetup(); $("#refresh").before(g, " "); }
  mcp = await c.use("mcp");
  if (!mcp) { setup("Connectors aren't available in this view. Open it in Claude."); return; }
  await reload(true);
  mcp.callTool(SKI, "get_weekend_outlook", null, { cache: { staleTime: 15 * 60e3, gcTime: 6 * 3600e3 } })
    .then(r => payload(r)).then(v => { skiOk = true; skiLive = v; try { renderSki(); } catch {} })
    .catch(() => { skiOk = false; try { renderSki(); } catch {} });
})();
