name: notify
# Relay: Claude's scheduled tasks run this to post a message to Bradley's Slack DM and the Discord powder channel.
#   gh workflow run notify.yml -R lostak/powder-report --ref main -f text="$(cat /tmp/msg.txt)"
on:
  workflow_dispatch:
    inputs:
      text: { description: 'Message (Slack markdown: *bold*; newlines allowed)', required: true, type: string }
permissions: {}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          TEXT: '${{ inputs.text }}'
          SLACK: '${{ secrets.SLACK_WEBHOOK_URL }}'
          DISCORD: '${{ secrets.DISCORD_WEBHOOK_URL }}'
        run: |
          node -e '
            const e = process.env, text = e.TEXT || "";
            const post = async (url, body) => { if (!url) return "skipped"; const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); return r.ok ? "ok" : "failed " + r.status; };
            (async () => {
              const s = await post(e.SLACK, { text });
              const d = await post(e.DISCORD, { content: text.replace(/\*([^*\n]+)\*/g, "**$1**").slice(0, 1990) });
              console.log("slack:", s, "discord:", d);
              if (s.startsWith("failed") || d.startsWith("failed")) process.exit(1);
            })();'
