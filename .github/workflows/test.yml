name: tests
on:
  push:
    paths: ['powder-report/*.js', 'powder-report/test/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: powder-report } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test test/
