name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: powder-report } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node -e '
          const B = require("./base"), c = require("./mountains.json"), st = {};
          B.bases(c.mountains, st, console.log).then(by => { for (const [n, b] of Object.entries(by)) console.log("R", n, JSON.stringify({ ...b, url: undefined }), B.label(b)); });'
