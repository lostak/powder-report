name: my-life-desktop
# Builds the My Life Windows app and publishes the installer + update feed (latest.yml, blockmap) to the
# "my-life-desktop" release. Installed copies check that release every 30 minutes and update themselves.
on:
  push:
    branches: [my-life-desktop]
  workflow_dispatch:
concurrency: { group: my-life-desktop, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { shell: bash, working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # every build gets a higher version so installed copies see it as an update
      - run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win nsis --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          f="dist/MyLife-Setup.exe dist/MyLife-Setup.exe.blockmap dist/latest.yml"
          notes="Version 1.1.${{ github.run_number }}, built $(TZ=America/Denver date '+%a %b %-d, %-I:%M %p'). First install: download MyLife-Setup.exe and run it (SmartScreen: More info → Run anyway). After that, My Life updates itself."
          if gh release view my-life-desktop >/dev/null 2>&1; then
            gh release upload my-life-desktop $f --clobber && gh release edit my-life-desktop --notes "$notes"
          else
            gh release create my-life-desktop $f --target my-life-desktop --title "My Life for Windows" --notes "$notes" --latest=false
          fi
